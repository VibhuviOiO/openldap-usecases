name: Validate use-cases

# One job per use-case, each asserting the *outcome* of the runbook rather than
# just "the container started": replication must replicate, the empty-PVC seed
# must seed, hostPort must be reachable from outside, and rotating the password
# must not crash-loop the server.
#
# The docker use-cases run against the published image. The kubernetes one
# starts the same k3s container 00-cluster documents, so the instructions the
# README gives a human are the ones CI executes.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "vibhuvioio/openldap tag to test"
        required: false
        default: "2.6.10"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

env:
  # Empty on push/PR, so the fallback is what CI normally uses.
  IMAGE_TAG: ${{ github.event.inputs.image_tag || '2.6.10' }}

jobs:
  # ---------------------------------------------------------------- docker --
  docker-use-cases:
    name: docker / ${{ matrix.use-case }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        use-case:
          - docker-secrets
          - idempotency-test
          - overlay-features
          - password-policy-test
          - password-rotation
          - tls-enabled
          - vibhuvi-com-singlenode
          - vibhuvioio-com-singlenode
          - oiocloud-com-multinode
    steps:
      - uses: actions/checkout@v7

      - name: Pull the image
        run: docker pull "vibhuvioio/openldap:${IMAGE_TAG}"

      # A couple of use-cases attach to a shared network by name.
      - name: Create the shared network
        run: docker network create ldap-shared-network || true

      - name: Run ${{ matrix.use-case }}
        working-directory: ${{ matrix.use-case }}
        run: ./test.sh "${IMAGE_TAG}"

      - name: Container logs
        if: failure()
        run: |
          for c in $(docker ps -aq); do
            echo "===== $(docker inspect -f '{{.Name}}' "$c") ====="
            docker logs "$c" 2>&1 | tail -40 || true
          done

  # Guards a regression that was invisible for a long time: the ACL was silently
  # absent because one unknown attribute made the whole modify fail, so the
  # directory looked fine while serving anonymous reads.
  acl-regression:
    name: image / ACL applied
    runs-on: ubuntu-latest
    steps:
      - name: Pull the image
        run: docker pull "vibhuvioio/openldap:${IMAGE_TAG}"

      - name: Anonymous read of the suffix must be denied
        run: |
          docker run -d --name acl-check \
            -e LDAP_DOMAIN=example.com \
            -e LDAP_ADMIN_PASSWORD=AdminPass123! \
            "vibhuvioio/openldap:${IMAGE_TAG}"

          for _ in $(seq 1 40); do
            docker exec acl-check /usr/local/bin/scripts/healthcheck.sh auto >/dev/null 2>&1 && break
            sleep 3
          done

          # The admin must be able to read it...
          docker exec acl-check ldapsearch -x -H ldap://localhost \
            -D "cn=Manager,dc=example,dc=com" -w AdminPass123! \
            -b "dc=example,dc=com" -s base dn | grep -q "^dn:" \
            || { echo "FAIL: admin cannot read the suffix"; exit 1; }

          # ...and anonymous must not.
          if docker exec acl-check ldapsearch -x -H ldap://localhost \
               -b "dc=example,dc=com" -s base dn 2>&1 | grep -q "^dn:"; then
            echo "FAIL: anonymous read returned entries - the ACL was not applied"
            exit 1
          fi

          echo "PASS: ACL applied"

      - name: Container logs
        if: failure()
        run: docker logs acl-check 2>&1 | tail -40 || true

  # ------------------------------------------------------------ kubernetes --
  k8s-single-node:
    name: kubernetes / 01-single-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/k3s

      - name: Run 01-single-node
        working-directory: kubernetes/01-single-node
        run: ./test.sh

      - name: Cluster state
        if: failure()
        run: |
          kubectl get pods,pvc -A -o wide
          kubectl -n ldap-single describe pods | tail -60 || true
          kubectl -n ldap-single logs deploy/ldap -c openldap --tail=60 || true

  k8s-three-node:
    name: kubernetes / 02-three-node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/k3s

      - name: Run 02-three-node
        working-directory: kubernetes/02-three-node
        run: ./test.sh

      - name: Cluster state
        if: failure()
        run: |
          kubectl get pods,pvc -A -o wide
          kubectl -n ldap-cluster describe pods | tail -60 || true
          kubectl -n ldap-cluster logs -l app=ldap -c openldap --tail=40 --prefix || true

  k8s-helm-chart:
    name: kubernetes / 03-helm-chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/k3s
      - uses: azure/setup-helm@v5

      # The published chart, like a user would get. Nothing here reaches into a
      # sibling checkout: this repo only consumes what `helm repo add` serves.
      - name: Run 03-helm-chart
        working-directory: kubernetes/03-helm-chart
        run: ./test.sh

      - name: Cluster state
        if: failure()
        run: |
          helm list -A
          kubectl get pods,pvc -A -o wide
          kubectl -n ldap-helm describe pods | tail -60 || true
          kubectl -n ldap-helm logs -l app.kubernetes.io/name=openldap -c openldap --tail=40 --prefix || true
