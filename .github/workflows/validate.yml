name: Validate use-cases

# Runs every use-case's test.sh against the image built from this commit.
# This is the gate that proves the features a contributor touched still work.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image:
        description: "Image to test (default: build from this repo)"
        required: false
        default: "openldap:ci"

permissions:
  contents: read

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout openldap-docker
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: VibhuviOiO/openldap-docker
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: openldap-docker

      - name: Build
        run: docker build -t openldap:ci ./openldap-docker

      # Passing the image between jobs needs an artifact; docker save is the
      # simplest reliable way for a single-arch CI runner.
      - name: Export image
        run: docker save openldap:ci -o /tmp/openldap-ci.tar

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: openldap-ci-image
          path: /tmp/openldap-ci.tar
          retention-days: 1

  use-cases:
    name: ${{ matrix.use-case }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        use-case:
          - docker-secrets
          - idempotency-test
          - overlay-features
          - password-policy-test
          - tls-enabled
          - vibhuvi-com-singlenode
          - vibhuvioio-com-singlenode
          - oiocloud-com-multinode
    steps:
      - name: Checkout openldap-usecases
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: openldap-ci-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/openldap-ci.tar

      # The use-case test scripts take an image *tag*, not a full image name,
      # so alias the CI build to the tag they expect.
      - name: Alias image for the use-case scripts
        run: docker tag openldap:ci vibhuvioio/openldap:latest

      - name: Create shared network
        run: docker network create ldap-shared-network || true

      - name: Run ${{ matrix.use-case }}
        working-directory: ${{ matrix.use-case }}
        run: ./test.sh latest

      - name: Dump logs on failure
        if: failure()
        run: |
          for c in $(docker ps -aq --filter "name=openldap"); do
            echo "===== $c ====="
            docker logs "$c" 2>&1 | tail -40 || true
          done

  no-anonymous-regression:
    name: ACL regression guard
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout openldap-docker
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: openldap-ci-image
          path: /tmp

      - name: Load image
        run: docker load -i /tmp/openldap-ci.tar

      # The ACL must actually be applied. It was silently absent for a long time
      # because one unknown attribute made the whole modify fail.
      - name: Anonymous read of the suffix must be denied
        run: |
          docker run -d --name acl-check \
            -e LDAP_DOMAIN=example.com \
            -e LDAP_ADMIN_PASSWORD=AdminPass123! \
            openldap:ci
          for i in $(seq 1 40); do
            docker exec acl-check /usr/local/bin/scripts/healthcheck.sh auto >/dev/null 2>&1 && break
            sleep 3
          done
          # admin must be able to read it
          docker exec acl-check ldapsearch -x -H ldap://localhost \
            -D "cn=Manager,dc=example,dc=com" -w AdminPass123! \
            -b "dc=example,dc=com" -s base dn | grep -q "^dn:" \
            || { echo "FAIL: admin cannot read the suffix"; exit 1; }
          # anonymous must not
          if docker exec acl-check ldapsearch -x -H ldap://localhost \
               -b "dc=example,dc=com" -s base dn 2>&1 | grep -q "^dn:"; then
            echo "FAIL: anonymous read returned entries - the ACL was not applied"
            exit 1
          fi
          echo "PASS: ACL applied"
          docker rm -f acl-check
